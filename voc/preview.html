<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOC报告预览</title><link rel="stylesheet" href="../assets/app.css"><style>
html,body,.preview-shell{height:100%;min-height:100%;margin:0}.preview-shell{display:grid;grid-template-rows:64px 1fr;background:#f6f8fc;color:#0f172a}.preview-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 20px;background:#fff;border-bottom:1px solid #d8e0ea;box-shadow:0 1px 2px rgba(15,23,42,.04);z-index:2}.preview-title{display:flex;align-items:center;gap:12px;min-width:0}.preview-mark{display:grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:#e8f0fe;color:#1a73e8;font-size:17px;font-weight:900;letter-spacing:-.02em}.preview-copy{display:flex;flex-direction:column;gap:2px;min-width:0}.preview-copy h1{margin:0;color:#0f172a!important;font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.02em}.preview-copy p{margin:0;color:#475569!important;font-size:12px;font-weight:600;line-height:1.25}.preview-frame{width:100%;height:100%;border:0;background:#fff}.preview-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto}.preview-actions .preview-link{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border:1px solid #c6d3e1;border-radius:999px;background:#fff;color:#0f172a!important;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 1px 1px rgba(15,23,42,.03)}.preview-actions .preview-link:hover{border-color:#1a73e8;color:#1a73e8!important;background:#f8fbff}.error-box{margin:18px;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}@media(max-width:720px){.preview-top{height:auto;padding:10px 14px;align-items:flex-start}.preview-actions{gap:8px}.preview-actions .preview-link{height:34px;padding:0 12px;font-size:13px}.preview-copy h1{font-size:16px}}
</style></head><body><main class="preview-shell"><header class="preview-top"><div class="preview-title"><span class="preview-mark">V</span><div class="preview-copy"><h1>VOC 报告预览</h1><p>站内在线预览</p></div></div><nav class="preview-actions"><a class="preview-link" href="../tool/">工具页</a><button id="theme-toggle" class="preview-link preview-theme" type="button">主题</button><a class="preview-link" href="./reportindex.html">返回列表</a><a id="raw-link" class="preview-link" target="_blank" rel="noopener">原始链接</a></nav></header><iframe id="frame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe></main><script>
const params=new URLSearchParams(location.search);
const url=params.get('url')||'';
const frame=document.getElementById('frame');
const raw=document.getElementById('raw-link');
function showError(text){frame.replaceWith(Object.assign(document.createElement('div'),{className:'error-box',textContent:text}));}
if(!url){showError('缺少报告 URL。');}else{raw.href=url;fetch(url,{mode:'cors'}).then(async response=>{if(!response.ok)throw new Error('HTTP '+response.status);const html=await response.text();frame.srcdoc=html;}).catch(error=>{showError('报告预览失败：'+error.message+'。请点“原始链接”查看或下载。');});}
</script></body></html>
