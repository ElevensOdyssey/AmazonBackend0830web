<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOC报告预览</title><link rel="stylesheet" href="../assets/app.css"><style>html,body,.preview-shell{height:100%;min-height:100%;margin:0}.preview-shell{display:grid;grid-template-rows:auto 1fr;padding:16px;gap:12px}.preview-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.preview-frame{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:#fff}.preview-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.error-box{padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}</style></head><body><main class="preview-shell"><header class="preview-top"><div><div class="eyebrow">VOC REPORT</div><h1 style="margin:0;font-size:24px">报告预览</h1></div><nav class="preview-actions"><a class="button secondary" href="./reportindex.html">返回列表</a><a id="raw-link" class="button secondary" target="_blank" rel="noopener">原始链接</a></nav></header><iframe id="frame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe></main><script>
const params=new URLSearchParams(location.search);
const url=params.get('url')||'';
const frame=document.getElementById('frame');
const raw=document.getElementById('raw-link');
function showError(text){frame.replaceWith(Object.assign(document.createElement('div'),{className:'error-box',textContent:text}));}
if(!url){showError('缺少报告 URL。');}else{raw.href=url;fetch(url,{mode:'cors'}).then(async response=>{if(!response.ok)throw new Error('HTTP '+response.status);const html=await response.text();frame.srcdoc=html;}).catch(error=>{showError('报告预览失败：'+error.message+'。请点“原始链接”查看或下载。');});}
</script></body></html>
