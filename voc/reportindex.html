<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOC报告列表</title><link rel="stylesheet" href="../assets/app.css"><style>.status-已完成{background:rgba(52,168,83,.18);color:#8ee4a8}.status-失败{background:rgba(234,67,53,.18);color:#ffb4ab}.status-排队中,.status-抓取评论,.status-标注中,.status-生成报告,.status-生成旅程,.status-标签归集{background:rgba(66,133,244,.18);color:#a8c7fa}html[data-theme=light] .status-已完成{color:#137333}html[data-theme=light] .status-失败{color:#a50e0e}html[data-theme=light] .status-排队中,html[data-theme=light] .status-抓取评论,html[data-theme=light] .status-标注中,html[data-theme=light] .status-生成报告,html[data-theme=light] .status-生成旅程,html[data-theme=light] .status-标签归集{color:#0b57d0}</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="./">用户洞察</a><nav class="nav"><a href="../tool/">工具页</a><a href="./">返回用户洞察</a><button id="theme-toggle" class="secondary theme-toggle" type="button">主题</button><button id="sign-out" class="secondary" type="button">退出</button></nav></header><section class="page-head"><div><div class="eyebrow">VOC REPORTS</div><h1 class="page-title">用户洞察报告列表</h1><p class="muted">这里显示已完成和正在处理的 VOC 评论分析任务。</p></div></section><article class="card"><div class="section-bar"><h2>报告列表</h2><button id="refresh" class="secondary" type="button">刷新</button></div><div id="reports"><div class="empty">正在读取报告...</div></div></article></main><script src="../assets/vendor/supabase.js"></script><script src="../assets/app-config.js"></script><script src="../assets/app.js"></script><script>
const db=window.supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabasePublishableKey);
const reports=document.getElementById('reports');
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function text(status){return {排队中:'排队中',抓取评论:'抓取评论',标注中:'八维标注中',生成报告:'生成报告',生成旅程:'生成旅程',标签归集:'标签归集',已完成:'已完成',失败:'失败'}[status]||status||'未知';}
async function load(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='../';return}const {data,error}=await db.from('voc_tasks').select('id,asins,status,report_file_path,failure_reason,created_at,updated_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(error){reports.innerHTML=`<div class="empty">读取失败：${esc(error.message)}</div>`;return}if(!data?.length){reports.innerHTML='<div class="empty">暂无 VOC 报告。回到用户洞察页提交 ASIN 后会出现在这里。</div>';return}reports.innerHTML=`<div class="table-wrap"><table><thead><tr><th>提交时间</th><th>ASIN</th><th>状态</th><th>更新时间</th><th>报告</th></tr></thead><tbody>${data.map(task=>`<tr><td>${new Date(task.created_at).toLocaleString()}</td><td>${esc((task.asins||[]).join(', '))}</td><td><span class="status status-${esc(task.status)}">${esc(text(task.status))}</span></td><td>${new Date(task.updated_at||task.created_at).toLocaleString()}</td><td>${task.report_file_path?`<a class="button secondary" href="./preview.html?url=${encodeURIComponent(task.report_file_path)}">打开报告</a>`:esc(task.failure_reason||'处理中')}</td></tr>`).join('')}</tbody></table></div>`;}
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('sign-out')?.addEventListener('click',async()=>{await db.auth.signOut();location.href='../';});
initTheme();load();setInterval(load,30000);
</script></body></html>
