<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户洞察｜亚马逊数据优化站</title><link rel="stylesheet" href="../assets/app.css"><style>.voc-form{display:grid;gap:14px}.voc-form textarea,.voc-form input,.voc-form select{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--border,#d7dce5);border-radius:8px;background:var(--surface,#fff);color:inherit}.voc-form textarea{min-height:150px}.voc-status{min-height:24px;color:#16845f}</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="../">亚马逊广告 数据优化站</a><nav class="nav"><a href="../tool/">工具页</a><a href="../report/">报告页</a><a class="active" href="./">用户洞察</a><button id="theme-toggle" class="secondary theme-toggle" type="button">主题</button><button id="sign-out" class="secondary" type="button">退出</button></nav></header><section class="page-head"><div><div class="eyebrow">VOC INSIGHT</div><h1 class="page-title">用户洞察</h1><p class="muted">从评论原文提取需求、体验和未满足点，生成可追溯的洞察报告。</p></div></section><article class="card"><h2>新建评论分析任务</h2><form class="voc-form" id="voc-form"><label>ASIN（每行一个，最多 10 个）<textarea id="voc-asins" required placeholder="B0GL4XLTRK"></textarea></label><label>评论来源<select id="voc-source"><option value="collect">从 Sorftime 抓取</option><option value="upload">上传已有评论表</option></select></label><label id="voc-file-label" hidden>评论表（CSV）<input id="voc-file" type="file" accept=".csv"></label><button type="submit">创建 VOC 任务</button><div class="voc-status" id="voc-status" role="status"></div></form></article><article class="card"><div class="section-bar"><h2>我的 VOC 任务</h2><a href="./reportindex.html">报告列表</a></div><div class="empty">暂无可查看的报告。</div></article></main><script src="../assets/vendor/supabase.js"></script><script src="../assets/app-config.js"></script><script src="../assets/app.js"></script><script>document.getElementById('voc-source').addEventListener('change',e=>document.getElementById('voc-file-label').hidden=e.target.value!=='upload');document.getElementById('voc-form').addEventListener('submit',async e=>{e.preventDefault();const o=document.getElementById('voc-status');const {data:{user}}=await window.supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabasePublishableKey).auth.getUser();if(!user){o.textContent='请先登录后提交。';return}const asins=[...new Set(document.getElementById('voc-asins').value.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean))];const db=window.supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabasePublishableKey);const {data,error}=await db.from('voc_tasks').insert({id:crypto.randomUUID(),user_id:user.id,asins,site:'US',source:'sorftime',status:'排队中',target_reviews_per_asin:100}).select('id').single();o.textContent=error?'创建失败：'+error.message:'任务已创建：'+data.id+'（排队中）';});</script></body></html>
