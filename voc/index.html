<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户洞察｜亚马逊数据优化站</title><link rel="stylesheet" href="../assets/app.css"><style>.voc-form{display:grid;gap:14px}.voc-form textarea,.voc-form input,.voc-form select{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--border,#d7dce5);border-radius:8px;background:var(--surface,#fff);color:inherit}.voc-form textarea{min-height:150px}.voc-status{min-height:24px;color:#16845f}.voc-table{width:100%;min-width:880px}.voc-actions{display:flex;gap:8px;flex-wrap:wrap}.status-排队中,.status-抓取评论,.status-标注中,.status-生成报告,.status-生成旅程,.status-标签归集{background:rgba(66,133,244,.18);color:#a8c7fa}.status-已完成{background:rgba(52,168,83,.18);color:#8ee4a8}.status-失败{background:rgba(234,67,53,.18);color:#ffb4ab}html[data-theme=light] .status-排队中,html[data-theme=light] .status-抓取评论,html[data-theme=light] .status-标注中,html[data-theme=light] .status-生成报告,html[data-theme=light] .status-生成旅程,html[data-theme=light] .status-标签归集{color:#0b57d0}html[data-theme=light] .status-已完成{color:#137333}html[data-theme=light] .status-失败{color:#a50e0e}</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="../">亚马逊广告 数据优化站</a><nav class="nav"><a href="../tool/">工具页</a><a href="../report/">报告页</a><a class="active" href="./">用户洞察</a><button id="theme-toggle" class="secondary theme-toggle" type="button">主题</button><button id="sign-out" class="secondary" type="button">退出</button></nav></header><section class="page-head"><div><div class="eyebrow">VOC INSIGHT</div><h1 class="page-title">用户洞察</h1><p class="muted">从评论原文提取需求、体验和未满足点，生成可追溯的洞察报告。</p></div></section><article class="card submit-card"><h2>新建评论分析任务</h2><form class="voc-form" id="voc-form"><label>ASIN（每行一个，最多 10 个）<textarea id="voc-asins" required placeholder="B0GL4XLTRK"></textarea></label><label>评论来源<select id="voc-source"><option value="collect">从 Sorftime 抓取</option><option value="upload">上传已有评论表</option></select></label><label id="voc-file-label" hidden>评论表（CSV）<input id="voc-file" type="file" accept=".csv"></label><button id="voc-submit" type="submit">创建 VOC 任务</button><div class="voc-status" id="voc-status" role="status"></div></form></article><article class="card"><div class="section-bar"><h2>我的 VOC 任务</h2><div class="voc-actions"><button id="voc-refresh" class="secondary" type="button">刷新</button><a href="./reportindex.html">报告列表</a></div></div><div id="voc-task-list"><div class="empty">正在读取任务...</div></div></article></main><script src="../assets/vendor/supabase.js"></script><script src="../assets/app-config.js"></script><script src="../assets/app.js"></script><script>
const vocDb=window.supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabasePublishableKey);
const vocStatus=document.getElementById('voc-status');
const vocList=document.getElementById('voc-task-list');
function vocEscape(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function vocStatusText(status){return {排队中:'排队中',抓取评论:'抓取评论',标注中:'八维标注中',生成报告:'生成报告',生成旅程:'生成旅程',标签归集:'标签归集',已完成:'已完成',失败:'失败'}[status]||status||'未知';}
function reportCell(task){if(task.report_file_path)return `<a class="button secondary" href="./preview.html?url=${encodeURIComponent(task.report_file_path)}">查看报告</a>`;if(task.status==='失败')return vocEscape(task.failure_reason||'失败');return vocEscape(task.failure_reason||'处理中，稍后刷新');}
async function currentUser(){const {data:{user}}=await vocDb.auth.getUser();if(!user){location.href='../';return null}return user;}
async function loadVocTasks(){const user=await currentUser();if(!user)return;const {data,error}=await vocDb.from('voc_tasks').select('id,asins,status,report_file_path,reviews_file_path,annotations_file_path,journey_file_path,groups_file_path,failure_reason,created_at,updated_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20);if(error){vocList.innerHTML=`<div class="empty">读取任务失败：${vocEscape(error.message)}</div>`;return}if(!data?.length){vocList.innerHTML='<div class="empty">暂无 VOC 任务。提交 ASIN 后，任务进度会显示在这里。</div>';return}vocList.innerHTML=`<div class="table-wrap"><table class="voc-table"><thead><tr><th>提交时间</th><th>ASIN</th><th>状态</th><th>数据文件</th><th>报告／失败原因</th></tr></thead><tbody>${data.map(task=>`<tr><td>${new Date(task.created_at).toLocaleString()}</td><td>${vocEscape((task.asins||[]).join(', '))}</td><td><span class="status status-${vocEscape(task.status)}">${vocEscape(vocStatusText(task.status))}</span></td><td>${['reviews_file_path','annotations_file_path','journey_file_path','groups_file_path'].filter(key=>task[key]).map(key=>`<span>${key.replace('_file_path','')}</span>`).join(' ')||'等待生成'}</td><td>${reportCell(task)}</td></tr>`).join('')}</tbody></table></div>`;}
document.getElementById('voc-source').addEventListener('change',e=>document.getElementById('voc-file-label').hidden=e.target.value!=='upload');
document.getElementById('voc-refresh').addEventListener('click',loadVocTasks);
document.getElementById('sign-out')?.addEventListener('click',async()=>{await vocDb.auth.signOut();location.href='../';});
document.getElementById('voc-form').addEventListener('submit',async e=>{e.preventDefault();const user=await currentUser();if(!user)return;const asins=[...new Set(document.getElementById('voc-asins').value.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean))].slice(0,10);if(!asins.length){vocStatus.textContent='请至少输入一个 ASIN。';return}const invalid=asins.find(asin=>!/^[A-Z0-9]{10}$/.test(asin));if(invalid){vocStatus.textContent=`ASIN 格式不对：${invalid}`;return}document.getElementById('voc-submit').disabled=true;vocStatus.textContent='正在创建任务...';const {data,error}=await vocDb.from('voc_tasks').insert({id:crypto.randomUUID(),user_id:user.id,asins,site:'US',source:'sorftime',status:'排队中',target_reviews_per_asin:100}).select('id').single();document.getElementById('voc-submit').disabled=false;if(error){vocStatus.textContent='创建失败：'+error.message;return}vocStatus.textContent='任务已创建：'+data.id+'（排队中）';await loadVocTasks();});
initTheme();loadVocTasks();setInterval(loadVocTasks,30000);
</script></body></html>
